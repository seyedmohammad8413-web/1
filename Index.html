<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه آزمون آنلاین</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Tahoma, Arial, sans-serif;
}

body {
    background: #f1f5f9;
    color: #1e293b;
}

/* Header */
.header {
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: white;
    padding: 20px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,.15);
}

.header h1 {
    font-size: 25px;
    margin-bottom: 7px;
}

.header p {
    opacity: .9;
}

/* Container */
.container {
    max-width: 1000px;
    margin: 30px auto;
    padding: 0 15px;
}

/* Start Page */
.start-box {
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
    max-width: 600px;
    margin: 50px auto;
}

.start-box h2 {
    text-align: center;
    margin-bottom: 25px;
}

.input-group {
    margin-bottom: 18px;
}

.input-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

.input-group input {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
}

.input-group input:focus {
    border-color: #2563eb;
}

/* Buttons */
button {
    border: none;
    cursor: pointer;
    border-radius: 10px;
    padding: 12px 22px;
    font-size: 15px;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
}

.start-btn {
    width: 100%;
    background: #2563eb;
    color: white;
    font-weight: bold;
    margin-top: 10px;
}

/* Exam */
.exam {
    display: none;
}

.exam-top {
    background: white;
    padding: 18px;
    border-radius: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
}

.timer {
    background: #fee2e2;
    color: #dc2626;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: bold;
    direction: ltr;
}

.student-name {
    font-weight: bold;
}

/* Progress */
.progress-box {
    background: white;
    padding: 15px;
    border-radius: 15px;
    margin-bottom: 20px;
}

.progress-bar {
    height: 10px;
    background: #e2e8f0;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
}

.progress {
    height: 100%;
    width: 0%;
    background: #2563eb;
    transition: .3s;
}

/* Question */
.question-box {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

.question-number {
    color: #2563eb;
    font-weight: bold;
    margin-bottom: 15px;
}

.question-text {
    font-size: 20px;
    font-weight: bold;
    line-height: 1.8;
    margin-bottom: 25px;
}

.options {
    display: grid;
    gap: 12px;
}

.option {
    border: 2px solid #e2e8f0;
    padding: 15px;
    border-radius: 12px;
    cursor: pointer;
    transition: .2s;
}

.option:hover {
    background: #eff6ff;
    border-color: #93c5fd;
}

.option.selected {
    background: #dbeafe;
    border-color: #2563eb;
}

.option input {
    margin-left: 10px;
}

/* Navigation */
.navigation {
    display: flex;
    justify-content: space-between;
    margin-top: 25px;
}

.prev-btn {
    background: #64748b;
    color: white;
}

.next-btn {
    background: #2563eb;
    color: white;
}

.submit-btn {
    background: #16a34a;
    color: white;
}

/* Question numbers */
.question-nav {
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 15px;
}

.question-nav h3 {
    margin-bottom: 15px;
}

.numbers {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.number {
    width: 40px;
    height: 40px;
    background: #e2e8f0;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

.number.active {
    background: #2563eb;
    color: white;
}

.number.answered {
    background: #22c55e;
    color: white;
}

/* Result */
.result {
    display: none;
    background: white;
    padding: 35px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.1);
}

.result h2 {
    color: #16a34a;
    margin-bottom: 25px;
}

.score {
    font-size: 55px;
    font-weight: bold;
    color: #2563eb;
    margin: 20px;
}

.result-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin: 25px 0;
}

.result-card {
    padding: 20px;
    border-radius: 12px;
    background: #f8fafc;
}

.result-card strong {
    display: block;
    font-size: 25px;
    margin-top: 8px;
}

.correct {
    color: #16a34a;
}

.wrong {
    color: #dc2626;
}

.empty {
    color: #64748b;
}

.restart {
    background: #2563eb;
    color: white;
}

/* Mobile */
@media(max-width: 600px) {

    .exam-top {
        flex-direction: column;
        gap: 15px;
    }

    .question-box {
        padding: 20px;
    }

    .question-text {
        font-size: 17px;
    }

    .result-grid {
        grid-template-columns: 1fr;
    }

    .navigation {
        gap: 8px;
    }

    button {
        padding: 10px 15px;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>🎓 سامانه آزمون آنلاین</h1>
    <p>آزمون چهارگزینه‌ای</p>
</header>

<div class="container">

<!-- Start -->
<div class="start-box" id="startPage">

    <h2>شروع آزمون</h2>

    <div class="input-group">
        <label>نام و نام خانوادگی</label>
        <input type="text" id="studentName" placeholder="نام خود را وارد کنید">
    </div>

    <div class="input-group">
        <label>شماره دانش‌آموزی / دانشجویی</label>
        <input type="text" id="studentId" placeholder="شماره خود را وارد کنید">
    </div>

    <button class="start-btn" onclick="startExam()">
        شروع آزمون
    </button>

</div>


<!-- Exam -->
<div class="exam" id="examPage">

    <div class="exam-top">
        <div class="student-name" id="displayName"></div>

        <div class="timer">
            ⏱ <span id="timer">30:00</span>
        </div>
    </div>

    <div class="progress-box">

        <div>
            سؤال <span id="currentQuestion">1</span>
            از
            <span id="totalQuestions"></span>
        </div>

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

    </div>


    <div class="question-box">

        <div class="question-number" id="questionNumber"></div>

        <div class="question-text" id="questionText"></div>

        <div class="options" id="options"></div>

        <div class="navigation">

            <button class="prev-btn" onclick="previousQuestion()">
                قبلی
            </button>

            <button class="next-btn" id="nextButton"
                    onclick="nextQuestion()">
                بعدی
            </button>

        </div>

    </div>


    <div class="question-nav">

        <h3>شماره سؤالات</h3>

        <div class="numbers" id="numbers"></div>

    </div>

</div>


<!-- Result -->
<div class="result" id="resultPage">

    <h2>🎉 آزمون به پایان رسید</h2>

    <p id="resultStudent"></p>

    <div class="score">
        <span id="percentage">0</span>٪
    </div>

    <div class="result-grid">

        <div class="result-card correct">
            پاسخ صحیح
            <strong id="correctCount">0</strong>
        </div>

        <div class="result-card wrong">
            پاسخ غلط
            <strong id="wrongCount">0</strong>
        </div>

        <div class="result-card empty">
            بدون پاسخ
            <strong id="emptyCount">0</strong>
        </div>

    </div>

    <p>
        نمره شما:
        <strong id="finalScore"></strong>
        از
        <strong id="totalScore"></strong>
    </p>

    <br>

    <button class="restart" onclick="location.reload()">
        آزمون مجدد
    </button>

</div>

</div>


<script>

/* =========================
   QUESTIONS
========================= */

const questions = [

{
    question: "پایتخت ایران کدام شهر است؟",
    options: ["مشهد", "تهران", "اصفهان", "شیراز"],
    answer: 1
},

{
    question: "کدام گزینه یک زبان برنامه‌نویسی است؟",
    options: ["HTML", "CSS", "JavaScript", "Photoshop"],
    answer: 2
},

{
    question: "حاصل 5 × 6 چند است؟",
    options: ["20", "25", "30", "35"],
    answer: 2
},

{
    question: "بزرگ‌ترین سیاره منظومه شمسی کدام است؟",
    options: ["زمین", "مریخ", "زحل", "مشتری"],
    answer: 3
},

{
    question: "آب در چند درجه سانتی‌گراد می‌جوشد؟",
    options: ["50", "75", "100", "120"],
    answer: 2
},

{
    question: "کدام مورد یک مرورگر اینترنتی است؟",
    options: ["Chrome", "Windows", "Android", "Linux"],
    answer: 0
},

{
    question: "حاصل 100 ÷ 4 چیست؟",
    options: ["20", "25", "30", "40"],
    answer: 1
},

{
    question: "کدام عنصر نماد O دارد؟",
    options: ["طلا", "اکسیژن", "آهن", "نقره"],
    answer: 1
},

{
    question: "HTML بیشتر برای چه کاری استفاده می‌شود؟",
    options: [
        "ساختار صفحات وب",
        "ویرایش عکس",
        "ساخت سیستم‌عامل",
        "ساخت سخت‌افزار"
    ],
    answer: 0
},

{
    question: "CSS برای چه کاری استفاده می‌شود؟",
    options: [
        "طراحی و ظاهر صفحات",
        "ذخیره اطلاعات",
        "ساخت پردازنده",
        "ارسال ایمیل"
    ],
    answer: 0
},

{
    question: "کدام مورد یک سیستم‌عامل است؟",
    options: ["Windows", "Google", "Chrome", "HTML"],
    answer: 0
},

{
    question: "زمین به دور چه چیزی می‌چرخد؟",
    options: ["ماه", "خورشید", "مریخ", "مشتری"],
    answer: 1
},

{
    question: "حاصل 12 + 8 چیست؟",
    options: ["18", "20", "22", "24"],
    answer: 1
},

{
    question: "کدام مورد برای ذخیره فایل استفاده می‌شود؟",
    options: ["Hard Disk", "Monitor", "Keyboard", "Mouse"],
    answer: 0
},

{
    question: "کدام گزینه یک زبان برنامه‌نویسی است؟",
    options: ["Python", "Windows", "Google", "HTML"],
    answer: 0
},

{
    question: "حاصل 9 × 9 چیست؟",
    options: ["72", "81", "90", "99"],
    answer: 1
},

{
    question: "کدام وسیله برای ورود متن استفاده می‌شود؟",
    options: ["Mouse", "Keyboard", "Monitor", "Speaker"],
    answer: 1
},

{
    question: "کدام گزینه موتور جست‌وجو است؟",
    options: ["Google", "Windows", "Python", "Android"],
    answer: 0
},

{
    question: "کدام مورد برای نمایش تصویر استفاده می‌شود؟",
    options: ["Keyboard", "Monitor", "Mouse", "CPU"],
    answer: 1
},

{
    question: "CPU در کامپیوتر چه نقشی دارد؟",
    options: [
        "پردازش اطلاعات",
        "نمایش تصویر",
        "ذخیره فایل",
        "چاپ کردن"
    ],
    answer: 0
}

];


/* =========================
   VARIABLES
========================= */

let current = 0;

let userAnswers =
    new Array(questions.length).fill(null);

let timeLeft = 30 * 60;

let timerInterval;


/* =========================
   START EXAM
========================= */

function startExam() {

    const name =
        document.getElementById("studentName").value.trim();

    if (name === "") {
        alert("لطفاً نام و نام خانوادگی را وارد کنید.");
        return;
    }

    document.getElementById("startPage").style.display = "none";

    document.getElementById("examPage").style.display = "block";

    document.getElementById("displayName").textContent =
        "دانش‌آموز: " + name;

    document.getElementById("totalQuestions").textContent =
        questions.length;

    createQuestionNumbers();

    showQuestion();

    startTimer();
}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion() {

    const q = questions[current];

    document.getElementById("questionNumber").textContent =
        "سؤال " + (current + 1);

    document.getElementById("currentQuestion").textContent =
        current + 1;

    document.getElementById("questionText").textContent =
        q.question;

    const options =
        document.getElementById("options");

    options.innerHTML = "";

    q.options.forEach((option, index) => {

        const div = document.createElement("div");

        div.className = "option";

        if (userAnswers[current] === index) {
            div.classList.add("selected");
        }

        div.innerHTML = `
            <input type="radio"
                   name="answer"
                   ${userAnswers[current] === index ? "checked" : ""}>
            ${option}
        `;

        div.onclick = function() {
            selectAnswer(index);
        };

        options.appendChild(div);

    });

    updateProgress();

    updateNumbers();

    document.getElementById("nextButton").textContent =
        current === questions.length - 1
        ? "پایان آزمون"
        : "بعدی";

}


/* =========================
   SELECT ANSWER
========================= */

function selectAnswer(index) {

    userAnswers[current] = index;

    showQuestion();

}


/* =========================
   NEXT
========================= */

function nextQuestion() {

    if (current === questions.length - 1) {

        const confirmSubmit =
            confirm("آیا مطمئن هستید که می‌خواهید آزمون را پایان دهید؟");

        if (confirmSubmit) {
            finishExam();
        }

        return;
    }

    current++;

    showQuestion();

}


/* =========================
   PREVIOUS
========================= */

function previousQuestion() {

    if (current > 0) {

        current--;

        showQuestion();

    }

}


/* =========================
   PROGRESS
========================= */

function updateProgress() {

    const percentage =
        ((current + 1) / questions.length) * 100;

    document.getElementById("progress").style.width =
        percentage + "%";

}


/* =========================
   QUESTION NUMBERS
========================= */

function createQuestionNumbers() {

    const container =
        document.getElementById("numbers");

    container.innerHTML = "";

    questions.forEach((q, index) => {

        const number =
            document.createElement("div");

        number.className = "number";

        number.textContent = index + 1;

        number.onclick = function() {

            current = index;

            showQuestion();

        };

        container.appendChild(number);

    });

}


function updateNumbers() {

    const numbers =
        document.querySelectorAll(".number");

    numbers.forEach((number, index) => {

        number.classList.remove("active");

        number.classList.remove("answered");

        if (index === current) {
            number.classList.add("active");
        }

        if (userAnswers[index] !== null) {
            number.classList.add("answered");
        }

    });

}


/* =========================
   TIMER
========================= */

function startTimer() {

    timerInterval =
        setInterval(function() {

            let minutes =
                Math.floor(timeLeft / 60);

            let seconds =
                timeLeft % 60;

            document.getElementById("timer").textContent =
                String(minutes).padStart(2, "0")
                + ":"
                + String(seconds).padStart(2, "0");

            timeLeft--;

            if (timeLeft < 0) {

                clearInterval(timerInterval);

                alert("زمان آزمون به پایان رسید.");

                finishExam();

            }

        }, 1000);

}


/* =========================
   FINISH EXAM
========================= */

function finishExam() {

    clearInterval(timerInterval);

    let correct = 0;
    let wrong = 0;
    let empty = 0;

    questions.forEach((q, index) => {

        if (userAnswers[index] === null) {

            empty++;

        }
        else if (userAnswers[index] === q.answer) {

            correct++;

        }
        else {

            wrong++;

        }

    });

    const percentage =
        Math.round((correct / questions.length) * 100);

    document.getElementById("examPage").style.display =
        "none";

    document.getElementById("resultPage").style.display =
        "block";

    document.getElementById("resultStudent").textContent =
        "نتیجه آزمون برای: " +
        document.getElementById("studentName").value;

    document.getElementById("percentage").textContent =
        percentage;

    document.getElementById("correctCount").textContent =
        correct;

    document.getElementById("wrongCount").textContent =
        wrong;

    document.getElementById("emptyCount").textContent =
        empty;

    document.getElementById("finalScore").textContent =
        correct;

    document.getElementById("totalScore").textContent =
        questions.length;

}

</script>

</body>
</html>
